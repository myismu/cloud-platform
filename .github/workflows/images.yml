name: Images

# 构建并推送镜像到 GHCR（GitHub 容器仓库）
# 推 main 自动执行，也可在 Actions 页面手动运行
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送镜像到 GHCR 需要

jobs:
  # ============ 后端服务镜像（平台仓库自包含，构建无需外部制品） ============
  backend-images:
    name: 后端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 打包 jar（跳过测试：测试已由 CI 流水线完成）
        run: mvn -B -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: |
            ghcr.io/myismu/cloud-platform/gateway:latest
            ghcr.io/myismu/cloud-platform/gateway:${{ github.sha }}

      - name: 构建并推送 user-hub-service
        uses: docker/build-push-action@v6
        with:
          context: service/user-hub-service
          push: true
          tags: |
            ghcr.io/myismu/cloud-platform/user-hub-service:latest
            ghcr.io/myismu/cloud-platform/user-hub-service:${{ github.sha }}

      - name: 构建并推送 file-service
        uses: docker/build-push-action@v6
        with:
          context: service/file-service
          push: true
          tags: |
            ghcr.io/myismu/cloud-platform/file-service:latest
            ghcr.io/myismu/cloud-platform/file-service:${{ github.sha }}

  # ============ 前端镜像 ============
  frontend-image:
    name: 前端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 userhub-web
        uses: docker/build-push-action@v6
        with:
          context: Web/UserHub-Web
          push: true
          tags: |
            ghcr.io/myismu/cloud-platform/userhub-web:latest
            ghcr.io/myismu/cloud-platform/userhub-web:${{ github.sha }}
