name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 后端：编译 + 测试 ============
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 编译并打包（含单元测试）
        run: mvn -B clean package

  # ============ 用户中心前端 ============
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        working-directory: Web/UserHub-Web
        run: pnpm install --frozen-lockfile

      - name: 构建
        working-directory: Web/UserHub-Web
        run: pnpm build
