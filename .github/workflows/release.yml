name: Release

# 发布 common / api / 父 pom 到 GitHub Packages
# 触发方式：手动（升完版本号后在 Actions 页面点 "Run workflow"）
# 说明：GitHub Packages 的同一版本不可覆盖，所以升级版本号后再运行
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送制品到 GitHub Packages 需要

jobs:
  publish:
    name: 发布制品到 GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17（配置 GitHub Packages 认证）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github            # 与根 pom 中 distributionManagement 的 id 一致
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: 发布父 pom（业务仓库的 parent 依赖它）
        run: mvn -B -N deploy -DskipTests

      - name: 发布 common 与 api
        run: mvn -B deploy -pl common,api -DskipTests
