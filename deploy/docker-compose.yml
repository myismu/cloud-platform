# ============================================================
# 服务器部署编排（全量：中间件 + 平台 + AI-PPT + 题库）
#
# 与各仓库开发用的 compose 不同：本文件全部使用 GHCR 镜像，
# 不在服务器上构建。
#
# 用法：
#   1. 将本文件与 .env.example 一起放到服务器（.env.example 复制为 .env 并填真实值）
#   2. docker compose up -d
# 更新：docker compose pull && docker compose up -d
# 回滚：把下面 image 的 :latest 改成要回滚的 commit 号，再 pull && up -d
# 详细步骤见 doc/部署清单.md
# ============================================================

services:
  # ==================== 中间件 ====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [app]

  redis:
    image: redis:alpine
    container_name: redis
    networks: [app]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      - MODE=standalone
      # 配置持久化到外部 MySQL（nacos_config 库），避免容器重建后配置丢失
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql            # 同一 compose 网络内的服务名，不是宿主机 IP
      - MYSQL_SERVICE_PORT=3306             # 容器间通信使用容器端口，不是宿主机映射端口 13306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # allowPublicKeyRetrieval 为 MySQL 8 默认 caching_sha2_password 认证所需
      - "MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    ports:
      - "8848:8848"   # Nacos 控制台（导入配置用，生产可关闭外网访问）
      - "9848:9848"
    depends_on: [mysql]
    networks: [app]

  # ==================== 中间件：消息队列（RocketMQ：NameServer + Broker 两个容器） ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m
    volumes:
      - ./data/rocketmq/namesrv/logs:/home/rocketmq/logs
    networks: [app]

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      - JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn256m
    volumes:
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store
    depends_on: [rocketmq-namesrv]
    networks: [app]

  # ==================== 中间件：分布式事务（可选；当前无业务使用全局事务，可不启动） ====================
  seata-server:
    image: apache/seata-server:2.5.0
    container_name: seata-server
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=file
      - CONSOLE_PORT=7091
    volumes:
      # 镜像的 classpath 为 resources/classes/libs，不包含 conf 目录；
      # 必须覆盖 resources/application.yml，否则 seata.registry.type=nacos 不生效
      - ./seata/application.yml:/seata-server/resources/application.yml
      - ./data/seata/sessionStore:/seata-server/sessionStore
    ports:
      - "7091:7091"   # Seata 控制台（可选开放）
    depends_on: [nacos]
    networks: [app]

  # ==================== 平台服务 ====================
  gateway:
    image: ghcr.io/myismu/cloud-platform/gateway:latest
    container_name: gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - REDIS_HOST=redis        # 网关鉴权需要校验 Redis 在线状态
    depends_on: [nacos]
    networks: [app]

  user-hub-service:
    image: ghcr.io/myismu/cloud-platform/user-hub-service:latest
    container_name: user-hub-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on: [nacos, mysql, redis]
    networks: [app]

  file-service:
    image: ghcr.io/myismu/cloud-platform/file-service:latest
    container_name: file-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - REDIS_HOST=redis
      - FILE_BASE_DIR=/data/upload
    volumes:
      - ./data/upload:/data/upload   # 上传文件与 PPT 模板持久化
    depends_on: [nacos]
    networks: [app]

  userhub-web:
    image: ghcr.io/myismu/cloud-platform/userhub-web:latest
    container_name: userhub-web
    ports:
      - "3333:80"
    depends_on: [gateway]
    networks: [app]

  # ==================== AI-PPT 业务 ====================
  ai-service:
    image: ghcr.io/myismu/ai-ppt/ai-service:latest
    container_name: ai-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql         # ai-service 同样使用 ai_db
      - REDIS_HOST=redis
    depends_on: [nacos, redis]
    networks: [app]

  ppt-service:
    image: ghcr.io/myismu/ai-ppt/ppt-service:latest
    container_name: ppt-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on: [nacos, mysql, redis]
    networks: [app]

  ai-ppt-web:
    image: ghcr.io/myismu/ai-ppt/ai-ppt-web:latest
    container_name: ai-ppt-web
    ports:
      - "3336:80"
    depends_on: [gateway]
    networks: [app]

  # ==================== 题库业务 ====================
  question-bank-service:
    image: ghcr.io/myismu/question-bank/question-bank-service:latest
    container_name: question-bank-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on: [nacos, mysql, redis]
    networks: [app]

  qb-web:
    image: ghcr.io/myismu/question-bank/qb-web:latest
    container_name: qb-web
    ports:
      - "3334:80"
    depends_on: [gateway]
    networks: [app]

  qb-admin:
    image: ghcr.io/myismu/question-bank/qb-admin:latest
    container_name: qb-admin
    ports:
      - "3335:80"
    depends_on: [gateway]
    networks: [app]

networks:
  app:
    driver: bridge
