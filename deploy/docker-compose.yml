# ============================================================
# 服务器部署编排（全量：中间件 + 平台 + AI-PPT + 题库）
#
# 与各仓库开发用的 compose 不同：本文件全部使用 GHCR 镜像，
# 不在服务器上构建。
#
# 用法：
#   1. 将本文件与 .env.example 一起放到服务器（.env.example 复制为 .env 并填真实值）
#   2. docker compose up -d
# 更新：docker compose pull && docker compose up -d
# 回滚：把下面 image 的 :latest 改成要回滚的 commit 号，再 pull && up -d
# 详细步骤见 doc/部署清单.md
#
# 部署约定：
#   - restart: unless-stopped：宿主机/Docker 重启后自动恢复；手动 stop 的容器保持停止
#   - healthcheck + depends_on.condition：等待依赖真正就绪，而不是只等容器进程启动
#   - 健康检查只探测端口或就绪接口，不依赖业务接口，避免把业务故障误判为容器故障
# ============================================================

services:
  # ==================== 中间件 ====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # mysqladmin ping 只判断 MySQL 是否可连接；$$ 转义为容器内的 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [app]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      - MODE=standalone
      # 配置持久化到外部 MySQL（nacos_config 库），避免容器重建后配置丢失
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql            # 同一 compose 网络内的服务名，不是宿主机 IP
      - MYSQL_SERVICE_PORT=3306             # 容器间通信使用容器端口，不是宿主机映射端口 13306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # allowPublicKeyRetrieval 为 MySQL 8 默认 caching_sha2_password 认证所需
      - "MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    ports:
      - "8848:8848"   # Nacos 控制台（导入配置用，生产可关闭外网访问）
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Nacos 就绪探针：MySQL 初始化完成、配置加载完成后才返回 200
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [app]

  # ==================== 中间件：消息队列（RocketMQ：NameServer + Broker 两个容器） ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m
    volumes:
      - ./data/rocketmq/namesrv/logs:/home/rocketmq/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [app]

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      - JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn256m
    volumes:
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10911"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [app]

  # ==================== 中间件：分布式事务（可选；当前无业务使用全局事务，可不启动） ====================
  seata-server:
    image: apache/seata-server:2.5.0
    container_name: seata-server
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=file
      - CONSOLE_PORT=7091
    volumes:
      # 镜像的 classpath 为 resources/classes/libs，不包含 conf 目录；
      # 必须覆盖 resources/application.yml，否则 seata.registry.type=nacos 不生效
      - ./seata/application.yml:/seata-server/resources/application.yml
      - ./data/seata/sessionStore:/seata-server/sessionStore
    ports:
      - "7091:7091"   # Seata 控制台（可选开放）
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8091"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]

  # ==================== 平台服务 ====================
  gateway:
    image: ghcr.io/myismu/cloud-platform/gateway:latest
    container_name: gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - REDIS_HOST=redis        # 网关鉴权需要校验 Redis 在线状态
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks: [app]

  user-hub-service:
    image: ghcr.io/myismu/cloud-platform/user-hub-service:latest
    container_name: user-hub-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seata-server:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8001"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 60s
    networks: [app]

  file-service:
    image: ghcr.io/myismu/cloud-platform/file-service:latest
    container_name: file-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - REDIS_HOST=redis
      - FILE_BASE_DIR=/data/upload
    volumes:
      - ./data/upload:/data/upload   # 上传文件与 PPT 模板持久化
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8003"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks: [app]

  userhub-web:
    image: ghcr.io/myismu/cloud-platform/userhub-web:latest
    container_name: userhub-web
    ports:
      - "3333:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [app]

  # ==================== AI-PPT 业务 ====================
  ai-service:
    image: ghcr.io/myismu/ai-ppt/ai-service:latest
    container_name: ai-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql         # ai-service 同样使用 ai_db
      - REDIS_HOST=redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8083"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 60s
    networks: [app]

  ppt-service:
    image: ghcr.io/myismu/ai-ppt/ppt-service:latest
    container_name: ppt-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seata-server:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8084"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 60s
    networks: [app]

  ai-ppt-web:
    image: ghcr.io/myismu/ai-ppt/ai-ppt-web:latest
    container_name: ai-ppt-web
    ports:
      - "3336:80"
    depends_on:
      gateway:
        condition: service_healthy
      file-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [app]

  # ==================== 题库业务 ====================
  question-bank-service:
    image: ghcr.io/myismu/question-bank/question-bank-service:latest
    container_name: question-bank-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seata-server:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8002"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 60s
    networks: [app]

  qb-web:
    image: ghcr.io/myismu/question-bank/qb-web:latest
    container_name: qb-web
    ports:
      - "3334:80"
    depends_on:
      gateway:
        condition: service_healthy
      file-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [app]

  qb-admin:
    image: ghcr.io/myismu/question-bank/qb-admin:latest
    container_name: qb-admin
    ports:
      - "3335:80"
    depends_on:
      gateway:
        condition: service_healthy
      file-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [app]

networks:
  app:
    driver: bridge
